name: Deploy PMS to GCP
# Retrigger deploy after SSH setup

on:
  push:
    branches:
      - main
      - master
    paths:
      - "PMS/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
      SSH_SERVICE_NAME: ${{ secrets.SSH_SERVICE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing required secret: SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ]; then
            echo "Missing required secrets: SSH_HOST and/or SSH_USER"
            exit 1
          fi
          echo "SSH target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT:-22}"
          echo "Remote path: ${SSH_REMOTE_PATH:-/var/www/pms/app}"
          echo "Service: ${SSH_SERVICE_NAME:-pms}"

      - name: Restore
        working-directory: PMS
        run: dotnet restore PMS.csproj --runtime linux-x64

      - name: Publish (linux-x64)
        working-directory: PMS
        run: |
          dotnet publish PMS.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --no-restore \
            --output ./publish-out/linux-x64

      - name: Verify publish output
        working-directory: PMS
        run: |
          test -f ./publish-out/linux-x64/PMS.dll
          ls -lah ./publish-out/linux-x64 | head -n 30

      - name: Package deployment archive
        working-directory: PMS
        run: |
          tar -czf /tmp/pms-gcp-deploy.tar.gz -C ./publish-out/linux-x64 .
          ls -lh /tmp/pms-gcp-deploy.tar.gz

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${SSH_PORT:-22}"
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload package to server
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          scp -i ~/.ssh/deploy_key \
            -P "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            /tmp/pms-gcp-deploy.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/pms-gcp-deploy.tar.gz"

      - name: Deploy on server
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REMOTE_PATH="${SSH_REMOTE_PATH:-/var/www/pms/app}"
          SERVICE_NAME="${SSH_SERVICE_NAME:-pms}"

          # Export values used by remote script
          export SERVER_NAME="${SSH_HOST}"
          export APP_DIR="${REMOTE_PATH}"
          export SERVICE_NAME
          export KEYS_DIR="$(dirname "$REMOTE_PATH")/data-protection-keys"

          # Stream remote deploy script with env overrides for host/path/service
          {
            echo "export SERVER_NAME='${SSH_HOST}'"
            echo "export APP_DIR='${REMOTE_PATH}'"
            echo "export SERVICE_NAME='${SERVICE_NAME}'"
            echo "export KEYS_DIR='$(dirname "$REMOTE_PATH")/data-protection-keys'"
            cat PMS/deploy-gcp-remote.sh
          } | ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" "bash -s"

      - name: Cleanup remote package
        if: always()
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" "rm -f /tmp/pms-gcp-deploy.tar.gz" || true

      - name: Deployment summary
        run: |
          echo "Deployed to http://${SSH_HOST}/"
          echo "Service: ${SSH_SERVICE_NAME:-pms}"
          echo "Path: ${SSH_REMOTE_PATH:-/var/www/pms/app}"
